apiVersion: apps/v1
kind: Deployment

metadata:
  name: shipping
  namespace: roboshop

  labels:
    project: roboshop
    tier: backend
    component: shipping

spec:
  replicas: 1

  selector:
    matchLabels:
      project: roboshop
      tier: backend
      component: shipping

  # Pod definition
  template:
    metadata:
      labels:
        project: roboshop
        tier: backend
        component: shipping

    spec:
      containers:
      - name: shipping
        image: sivajanardhan/shipping:5.0.0.0

        ports:
        - name: liveness-port
          containerPort: 8080

        startupProbe:
          httpGet:
            path: /health
            port: liveness-port
          # 30 × 10 = 300 seconds = 5 minutes
          failureThreshold: 30
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /health
            port: liveness-port
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /health
            port: liveness-port
          periodSeconds: 10

        envFrom:
        - configMapRef:
            name: shipping
---

apiVersion: v1
kind: Service
metadata:
  name: shipping
  namespace: roboshop
  # servicer labels
  labels:
    project: roboshop
    tier: backend
    component: shipping
spec:
  # Service uses the below labels to select the pods
  selector:
    project: roboshop
    tier: backend
    component: shipping
  ports:
    - protocol: TCP
      port: 8080 # service port
      targetPort: 8080 # container port